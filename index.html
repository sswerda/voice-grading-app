<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#274e44"><title>Voice Grading App</title><link rel="icon" type="image/png" href="./voice_icon_180.png?v=3"><link rel="apple-touch-icon" sizes="180x180" href="./voice_icon_180.png?v=3"><meta name="apple-mobile-web-app-title" content="Voice Grading"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#192c27;background:#f7f8f7}*{box-sizing:border-box}body{margin:0}main{max-width:690px;margin:auto;padding:18px 16px 70px}h1{font-size:1.55rem;margin:0 0 5px}p{line-height:1.45}small,.muted{color:#59645f}label{display:block;font-weight:650;margin:12px 0 5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:12px;border:1px solid #a8b5ae;border-radius:10px;background:white;color:#192c27;font-size:16px}button{border:0;border-radius:10px;min-height:45px;padding:10px 16px;cursor:pointer;background:#265649;color:#fff;font-weight:650}button:disabled{opacity:.55}button.secondary{background:#e4ece8;color:#173e33}button.danger{background:#754034}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #79a999}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.card{background:white;border:1px solid #d8e0dc;border-radius:14px;padding:16px;margin:15px 0}#status{font-weight:650;min-height:24px}#heard{color:#31534b}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{border-bottom:1px solid #e1e7e4;padding:8px;text-align:left}th{background:#f1f4f2}td:first-child{width:80px}td select{padding:7px}#results{display:none}.submitrow{padding:8px 0}.submitrow button{width:100%}.manual{margin-top:14px;border-top:1px solid #e1e7e4;padding-top:12px}.manual summary{cursor:pointer;font-weight:650;color:#265649}.hint{font-size:.9rem}.pill{padding:5px 9px;border-radius:99px;background:#e2eae5}#notice{color:#82412d}@media(max-width:460px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<h1>Voice Grading App</h1>
<section class="card"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.1rem;margin:0">Record grades</h2><span class="pill" id="count">0 / 19 graded</span></div>
<label for="spoken">Grades</label><textarea id="spoken" rows="2" enterkeyhint="done" placeholder="Student one scored five. Student two scored six."></textarea><div class="submitrow"><button id="parse" type="button">Record grades</button></div><p id="status" class="hint" aria-live="polite"></p><p id="notice" class="hint" aria-live="polite"></p><details class="hint"><summary>Last dictation</summary><p id="heard"></p></details>

</section>
<section class="card" id="gradeList"><details id="gradeDetails"><summary style="cursor:pointer;font-weight:650">Grade list</summary><div id="results"><p class="hint muted" id="summary"></p><div class="tablewrap"><table><thead><tr><th>Student</th><th>Grade (editable)</th></tr></thead><tbody id="rows"></tbody></table></div><div class="row" style="margin-top:14px"><button id="copy" class="secondary">Copy list</button><button id="print" class="secondary">Print</button></div></div></details></section>
<section class="card"><details><summary style="cursor:pointer;font-weight:650">Settings & corrections</summary><label for="classSize">Number of students</label><input id="classSize" type="number" min="1" max="40" step="1" value="19" style="max-width:120px"><details class="manual"><summary>Enter or correct a grade manually</summary><div class="grid"><div><label for="student">Student #</label><input id="student" type="number" min="1" max="40" placeholder="Student #"></div><div id="gradebox"><label for="grade">Grade</label><select id="grade"><option>O</option><option>S+</option><option selected>S</option><option>S−</option><option>N</option><option value="custom">Score (enter below)</option></select><input id="pointsEntry" style="display:none;margin-top:6px" placeholder="18 or 3/5" inputmode="text"></div></div>
<div class="row" style="margin-top:12px"><button id="manual">Save grade</button><button id="undo" class="secondary">Undo last entry</button></div></details><button id="new" class="secondary" style="margin-top:12px">Clear for next stack</button></details></section>

</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),KEY='voice-grading-v1';let scores={},history=[],show=true,studentCount=19;const norm=t=>String(t).replace(/−/g,'-').trim();
function key(){return 'quick-grade-list'}
function save(){try{localStorage.setItem(KEY,JSON.stringify({key:key(),scores,studentCount}))}catch(e){$('notice').textContent='Local save unavailable: keep this page open or copy your results.'}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');if(x.scores)scores=x.scores;else scores={};studentCount=Number.isInteger(x.studentCount)&&x.studentCount>=1&&x.studentCount<=40?x.studentCount:19;$('classSize').value=studentCount}catch(e){scores={}}history=[];render()}
function render(){let n=Object.keys(scores).filter(k=>Number(k)<=studentCount).length;$('count').textContent=n+' / '+studentCount+' graded';$('summary').textContent=n+' graded · '+(studentCount-n)+' blank';$('results').style.display='block';const body=$('rows');body.replaceChildren();for(let i=1;i<=studentCount;i++){const tr=document.createElement('tr'),a=document.createElement('td'),b=document.createElement('td');a.textContent=String(i);const inp=document.createElement('input');inp.setAttribute('aria-label','Grade for student '+i);inp.value=scores[i]??'';inp.placeholder='—';inp.addEventListener('change',()=>{const v=inp.value.trim();if(!v)delete scores[i];else if(valid(v))scores[i]=v;else{$('notice').textContent='Invalid grade for student '+i;inp.value=scores[i]||'';return}save();render()});b.append(inp);tr.append(a,b);body.append(tr)}}
function valid(v){v=norm(v);return ['O','S+','S','S-','N'].includes(v)||/^(?:\d{1,3})\s*\/\s*(?:\d{1,3})$/.test(v)&&Number(v.split('/')[0])<=Number(v.split('/')[1])&&Number(v.split('/')[1])>0||/^\d{1,4}(?:\.\d{1,2})?$/.test(v)}
function put(id,val){if(id<1||id>studentCount||!valid(val))return false;history.push({id,prior:scores[id]});scores[id]=norm(val);save();render();$('status').textContent='Saved #'+id+': '+scores[id];return true}
function normalizeGrade(t){t=t.toLowerCase().replace(/\b(?:um+|uh+|erm|hmm+|ah+|like|you know|let me see|let's see|hold on|okay|ok)\b[,.!? ]*/g,' ').replace(/\s+/g,' ').trim().replace(/\bplus\b/g,'+').replace(/\bminus\b/g,'-');let m=t.match(/(?:^|[\s,.:;])(s\s*[+-]?|o|n)(?=[\s,.:;!?]|$)/i);if(m)return m[1].replace(/\s/g,'').toUpperCase();let p=t.match(/\b(\d{1,3})\s*(?:out of|\/|of)\s*(\d{1,3})\b/);if(p)return p[1]+'/'+p[2];let raw=t.match(/(?:^|[\s,.:;])(\d{1,4}(?:\.\d{1,2})?)(?=[\s,.:;!?]|$)/);return raw?raw[1]:null}
const words={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19};
const ordinals={first:1,second:2,third:3,fourth:4,fifth:5,sixth:6,seventh:7,eighth:8,ninth:9,tenth:10,eleventh:11,twelfth:12,thirteenth:13,fourteenth:14,fifteenth:15,sixteenth:16,seventeenth:17,eighteenth:18,nineteenth:19};
function numericWords(t){return t.toLowerCase().replace(/\b(\d{1,2})(?:st|nd|rd|th)\b/g,'$1').replace(/\b[a-z]+\b/g,m=>Object.prototype.hasOwnProperty.call(words,m)?String(words[m]):Object.prototype.hasOwnProperty.call(ordinals,m)?String(ordinals[m]):m)}
function process(raw){
 $('notice').textContent='';$('heard').textContent='Heard: '+raw;
 const text=numericWords(raw).replace(/[–—]/g,'-').replace(/\b(?:grade|number|student)\b/gi,m=>'|'+m);
 const parts=text.split('|').map(s=>s.trim()).filter(Boolean);
 let saved=0;const skipped=[];
 for(const part of parts){
  // Require a clear boundary between student ID and score.
  // Never guess how to split iPhone's merged numbers (e.g. "number 110").
  const m=part.match(/^(?:(?:grade|student|number)\s+)?(\d{1,2})\s*(?:[,;:=]\s*|\s+(?:got|gets|is|scored|score|grade|earned|has)\s+)(O|S\+?|S-|N|\d{1,3}(?:\.\d{1,2})?(?:\s*(?:\/|out of)\s*\d{1,3})?)\s*[.!?]*$/i);
  if(!m){skipped.push(part);continue}
  const id=Number(m[1]),value=normalizeGrade(m[2]);
  if(id>=1&&id<=studentCount&&value&&valid(value)){
   if(put(id,value))saved++;else skipped.push(part);
  }else skipped.push(part);
 }
 $('notice').textContent=(saved?saved+' grade(s) captured. Check the grade list.':'No grades saved.')+
 (skipped.length?' Not saved (unclear student/score): '+skipped.join(' | ')+'. Say "student one scored five" so your phone separates the numbers.':'');
 return saved;
}

$('classSize').addEventListener('change',()=>{const v=Number($('classSize').value);if(!Number.isInteger(v)||v<1||v>40){$('classSize').value=studentCount;$('notice').textContent='Enter a class size from 1 to 40.';return}studentCount=v;save();render();$('notice').textContent='Class size updated to '+v+'. Existing scores are preserved.'});
$('new').addEventListener('click',()=>{if(Object.keys(scores).length&&!confirm('Clear all grades? Make sure you have copied them to your paper book first.'))return;scores={};history=[];save();show=true;render();$('status').textContent='List cleared for next stack.'});
$('grade').addEventListener('change',()=>{$('pointsEntry').style.display=$('grade').value==='custom'?'block':'none'});
$('manual').addEventListener('click',()=>{const id=Number($('student').value),v=$('grade').value==='custom'?$('pointsEntry').value:$('grade').value;if(!put(id,v))$('notice').textContent='Enter a student number within your class size and a valid grade.';else $('notice').textContent='';});
function submitSpoken(){const saved=process($('spoken').value);if(saved){$('spoken').value='';$('spoken').blur();$('gradeDetails').open=true;$('gradeList').scrollIntoView({behavior:'smooth',block:'start'});}}
$('parse').addEventListener('click',submitSpoken);
$('spoken').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitSpoken();}});
$('undo').addEventListener('click',()=>{const h=history.pop();if(!h)return;if(h.prior===undefined)delete scores[h.id];else scores[h.id]=h.prior;save();render();$('status').textContent='Undid last entry for #'+h.id});

$('copy').addEventListener('click',async()=>{const text=Array.from({length:studentCount},(_,i)=>(i+1)+'\t'+(scores[i+1]||'')).join('\n');try{await navigator.clipboard.writeText(text);$('status').textContent='List copied.'}catch(e){$('notice').textContent='Copy unavailable. Select grades from the table instead.'}});
$('print').addEventListener('click',()=>window.print());
load();
})();
</script></body></html>
